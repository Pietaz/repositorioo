<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Personagens - Stardew Valley</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4e4c1; margin: 0; }
        header { background: #5a8f3d; color: white; text-align: center; padding: 20px; }
        nav { background: #3b2a1a; padding: 15px; text-align: center; }
        nav a { color: #f4e4c1; margin: 0 15px; text-decoration: none; }
        main { max-width: 800px; margin: 30px auto; padding: 20px; }
        .personagem {
            background: white; padding: 15px; margin-bottom: 15px;
            border-radius: 8px; border-left: 5px solid #5a8f3d;
        }
        .personagem h3 { color: #8b4513; margin-top: 0; }
    </style>
</head>
<body>
    <header><h1>Personagens</h1></header>
    <nav>
        <a href="/">Início</a>
        <a href="/personagens">Personagens</a>
        <a href="/sobre">Sobre</a>
    </nav>
    <main>
        <!-- Aqui usamos o Jinja2 do Flask pra listar os personagens -->
        {% for p in personagens %}
        <div class="personagem">
            <h3>{{ p.nome }}</h3>
            <p>{{ p.desc }}</p>
        </div>
        {% endfor %}
    </main>
</body>
</html>
